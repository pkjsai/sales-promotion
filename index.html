                                                        <td style={{ width: '45%', textAlign: 'center', verticalAlign: 'bottom' }}>
                                                            <div style={{ height: '1px', backgroundColor: '#475569', width: '100%', marginBottom: '8px' }}></div>
                                                            <p style={{ margin: '0', fontWeight: 'bold', color: '#0f172a', fontSize: '12px' }}>User Signature</p>
                                                            <p style={{ margin: '4px 0 0 0', color: '#64748b', fontSize: '11px' }}>({pdfData.fullName})</p>
                                                        </td>
                                                        <td style={{ width: '10%' }}></td>
                                                        <td style={{ width: '45%', textAlign: 'center', verticalAlign: 'bottom' }}>
                                                            <div style={{ height: '1px', backgroundColor: '#475569', width: '100%', marginBottom: '8px' }}></div>
                                                            <p style={{ margin: '0', fontWeight: 'bold', color: '#0f172a', fontSize: '12px' }}>Manager Signature</p>
                                                            <p style={{ margin: '4px 0 0 0', color: '#64748b', fontSize: '11px' }}>(Verification & Approval)</p>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FORM CONTAINER */}
                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl mb-8 no-print">
                        <form onSubmit={handleSubmit} className="space-y-4">
                            
                            <div className="flex items-center justify-between pb-1">
                                <button 
                                    type="button"
                                    onClick={handleFetchData}
                                    disabled={isFetchingEmp}
                                    className="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-3 py-1.5 rounded transition-all shadow flex items-center space-x-1.5 disabled:opacity-50"
                                >
                                    <span>🔍</span>
                                    <span>{isFetchingEmp ? 'Fetching Data...' : 'Fetch Data'}</span>
                                </button>

                                <p className="text-[11px] text-amber-400 font-medium italic whitespace-nowrap text-right pl-2">
                                    # Data will be captured from server, In case not updated then update it.
                                </p>
                            </div>

                            <div className="flex flex-wrap items-center gap-3">
                                <div className="w-full sm:w-36">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">
                                        EMP ID * {userRole !== 'Admin' && <span className="text-xs text-amber-400 font-normal">(Locked)</span>}
                                    </label>
                                    <input 
                                        type="text" 
                                        name="empId" 
                                        value={formData.empId} 
                                        onChange={handleEmpIdChange}
                                        maxLength={9}
                                        inputMode="numeric"
                                        placeholder="e.g. 123456789"
                                        required
                                        disabled={userRole !== 'Admin'}
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 tracking-wider font-mono text-sm disabled:bg-slate-800 disabled:text-slate-400 disabled:cursor-not-allowed"
                                    />
                                </div>

                                <div className="w-full sm:flex-1 min-w-[170px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">Full Name #</label>
                                    <input 
                                        type="text" 
                                        name="fullName" 
                                        value={formData.fullName} 
                                        onChange={handleChange} 
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    />
                                </div>

                                <div className="w-full sm:flex-1 min-w-[160px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">Department #</label>
                                    <input 
                                        type="text" 
                                        name="department" 
                                        value={formData.department} 
                                        onChange={handleChange} 
                                        placeholder="e.g. Engineering"
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    />
                                </div>

                                <div className="w-full sm:flex-[1.2] min-w-[210px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">Email Address #</label>
                                    <input 
                                        type="email" 
                                        name="email" 
                                        value={formData.email} 
                                        onChange={handleChange} 
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    />
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-3 pt-1">
                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">Location</label>
                                    <select 
                                        name="location" 
                                        value={formData.location} 
                                        onChange={handleChange} 
                                        disabled={isLoadingOptions}
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm disabled:opacity-50"
                                    >
                                        <option value="">Select Location</option>
                                        {locations.map((item, idx) => (
                                            <option key={idx} value={item}>{item}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">Event Type</label>
                                    <select 
                                        name="eventType" 
                                        value={formData.eventType} 
                                        onChange={handleChange} 
                                        disabled={isLoadingOptions}
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm disabled:opacity-50"
                                    >
                                        <option value="">Select Event Type</option>
                                        {eventTypes.map((item, idx) => (
                                            <option key={idx} value={item}>{item}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">Beneficiary Category</label>
                                    <select 
                                        name="beneficiaryCategory" 
                                        value={formData.beneficiaryCategory} 
                                        onChange={handleChange} 
                                        disabled={isLoadingOptions}
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm disabled:opacity-50"
                                    >
                                        <option value="">Select Category</option>
                                        {beneficiaryCategories.map((item, idx) => (
                                            <option key={idx} value={item}>{item}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-3 pt-1">
                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">Contribution Amt</label>
                                    <input 
                                        type="number" 
                                        name="contributionAmt" 
                                        value={formData.contributionAmt} 
                                        onChange={handleChange} 
                                        placeholder="e.g. 5000"
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    />
                                </div>

                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">Event Date (DD.MM.YY) *</label>
                                    <input 
                                        type="text" 
                                        name="eventDate" 
                                        value={formData.eventDate} 
                                        onChange={handleEventDateChange} 
                                        placeholder="10.10.26"
                                        maxLength={8}
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm font-mono tracking-wider"
                                    />
                                </div>

                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">Beneficiary Name</label>
                                    <input 
                                        type="text" 
                                        name="beneficiaryName" 
                                        value={formData.beneficiaryName} 
                                        onChange={handleChange} 
                                        placeholder="Enter Name"
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    />
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-3 pt-1">
                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">IO No</label>
                                    <input 
                                        type="text" 
                                        name="ioNo" 
                                        value={formData.ioNo} 
                                        onChange={handleChange} 
                                        placeholder="Optional IO No"
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    />
                                </div>

                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">GL Code</label>
                                    <select 
                                        name="glCode" 
                                        value={formData.glCode} 
                                        onChange={handleChange} 
                                        disabled={isLoadingOptions}
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm font-mono disabled:opacity-50"
                                    >
                                        <option value="">Select GL Code</option>
                                        {glCodes.map((item, idx) => (
                                            <option key={idx} value={item}>{item}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm font-bold text-slate-200 mb-1">Cost Center</label>
                                    <select 
                                        name="costCenter" 
                                        value={formData.costCenter} 
                                        onChange={handleChange} 
                                        disabled={isLoadingOptions}
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm font-mono disabled:opacity-50"
                                    >
                                        <option value="">Select Cost Center</option>
                                        {costCenters.map((item, idx) => (
                                            <option key={idx} value={item}>{item}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-slate-200 mb-1">Notes</label>
                                <textarea name="notes" value={formData.notes} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm" rows="2"></textarea>
                            </div>

                            <button 
                                type="submit" 
                                disabled={isSyncing}
                                className="w-full bg-cyan-600 hover:bg-cyan-500 font-bold py-2.5 rounded transition-all text-white shadow-lg disabled:opacity-50 text-sm mt-2"
                            >
                                {isSyncing ? 'Syncing to Sheet...' : 'Submit & Sync Data'}
                            </button>
                        </form>
                    </div>

                    {records.length > 0 && (
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl no-print">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-slate-200">My Submitted Records</h2>
                                <span className="text-xs text-slate-400">Showing last 12 local submissions</span>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left text-slate-300">
                                    <thead className="text-xs uppercase bg-slate-900 text-slate-400 font-bold">
                                        <tr>
                                            <th className="px-4 py-3">Ref No</th>
                                            <th className="px-4 py-3">Timestamp</th>
                                            <th className="px-4 py-3">EMP ID</th>
                                            <th className="px-4 py-3">Name</th>
                                            <th className="px-4 py-3">Department</th>
                                            <th className="px-4 py-3">Email</th>
                                            <th className="px-4 py-3">Location</th>
                                            <th className="px-4 py-3">Event Type</th>
                                            <th className="px-4 py-3">Category</th>
                                            <th className="px-4 py-3">Amt</th>
                                            <th className="px-4 py-3">Date</th>
                                            <th className="px-4 py-3">Beneficiary</th>
                                            <th className="px-4 py-3">IO No</th>
                                            <th className="px-4 py-3">GL Code</th>
                                            <th className="px-4 py-3">Cost Center</th>
                                            <th className="px-4 py-3 text-center">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700">
                                        {records.map((rec) => (
                                            <tr key={rec.id} className="hover:bg-slate-750">
                                                <td className="px-4 py-3 font-semibold text-cyan-400 font-mono">{formatCleanRefNo(rec.refNumber, rec.eventDate) || '-'}</td>
                                                <td className="px-4 py-3 text-xs text-slate-400">{rec.timestamp}</td>
                                                <td className="px-4 py-3 font-semibold text-cyan-400 font-mono">{rec.empId}</td>
                                                <td className="px-4 py-3 font-medium text-white">{rec.fullName}</td>
                                                <td className="px-4 py-3">{rec.department}</td>
                                                <td className="px-4 py-3">{rec.email}</td>
                                                <td className="px-4 py-3">{rec.location || '-'}</td>
                                                <td className="px-4 py-3">{rec.eventType || '-'}</td>
                                                <td className="px-4 py-3">{rec.beneficiaryCategory || '-'}</td>
                                                <td className="px-4 py-3 font-mono">{rec.contributionAmt || '-'}</td>
                                                <td className="px-4 py-3 font-mono text-xs">{rec.eventDate || '-'}</td>
                                                <td className="px-4 py-3">{rec.beneficiaryName || '-'}</td>
                                                <td className="px-4 py-3">{rec.ioNo || '-'}</td>
                                                <td className="px-4 py-3 font-mono">{rec.glCode || '-'}</td>
                                                <td className="px-4 py-3 font-mono">{rec.costCenter || '-'}</td>
                                                <td className="px-4 py-3 text-center">
                                                    <button 
                                                        type="button"
                                                        onClick={() => setPdfData(rec)}
                                                        className="bg-cyan-900/60 hover:bg-cyan-800 text-cyan-300 text-xs font-semibold px-2.5 py-1 rounded border border-cyan-700/60 transition-all shadow"
                                                    >
                                                        📄 PDF
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
