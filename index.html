<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Promotion Claim Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            body > div:not(#print-root) {
                display: none !important;
            }
            #print-root {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>
    <div id="print-root" class="hidden"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycbxrwTQ-mJ9GPtu2NJRyu0W-XCFyOLVMWWCvdG92aRjkT_95XAnIelNVH6MZ3I1r_hz1Yg/exec";

        function App() {
            // Auth States
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [credentials, setCredentials] = useState({ userId: '', password: '' });
            const [userRole, setUserRole] = useState('Normal');
            const [loggedInUserId, setLoggedInUserId] = useState('');
            const [loggedInUserName, setLoggedInUserName] = useState('');
            const [isAuthenticating, setIsAuthenticating] = useState(false);
            const [authError, setAuthError] = useState('');

            // Dynamic Dropdown Options
            const [locations, setLocations] = useState([]);
            const [eventTypes, setEventTypes] = useState([]);
            const [beneficiaryCategories, setBeneficiaryCategories] = useState([]);
            const [glCodes, setGlCodes] = useState([]);
            const [costCenters, setCostCenters] = useState([]);
            const [isLoadingOptions, setIsLoadingOptions] = useState(false);

            // Form Data
            const [formData, setFormData] = useState({
                empId: '',
                fullName: '',
                department: '',
                email: '',
                location: '',
                eventType: '',
                beneficiaryCategory: '',
                contributionAmt: '',
                eventDate: '',
                beneficiaryName: '',
                ioNo: '',
                glCode: '',
                costCenter: '',
                notes: '',
                hasExceptionApproval: false
            });

            const [records, setRecords] = useState([]);
            const [allAdminRecords, setAllAdminRecords] = useState([]);
            const [selectedRows, setSelectedRows] = useState([]);
            const [isSyncing, setIsSyncing] = useState(false);
            const [isFetchingEmp, setIsFetchingEmp] = useState(false);
            const [toast, setToast] = useState('');
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [sameDateWarningModal, setSameDateWarningModal] = useState(false);
            const [delayWarningModal, setDelayWarningModal] = useState(false);
            const [pendingDelayDays, setPendingDelayDays] = useState(0);
            const [pdfData, setPdfData] = useState(null);

            useEffect(() => {
                const sessionUser = sessionStorage.getItem('portal_user_id');
                const sessionRole = sessionStorage.getItem('portal_user_role') || 'Normal';
                const sessionName = sessionStorage.getItem('portal_user_name') || '';

                if (sessionUser) {
                    setIsAuthenticated(true);
                    setLoggedInUserId(sessionUser);
                    setUserRole(sessionRole);
                    setLoggedInUserName(sessionName);

                    if (sessionRole === 'Admin') {
                        fetchAdminRecords();
                    } else {
                        setFormData(prev => ({ ...prev, empId: sessionUser }));
                    }
                }
            }, []);

            useEffect(() => {
                if (isAuthenticated && loggedInUserId) {
                    const storageKey = `user_private_records_${loggedInUserId}`;
                    const saved = localStorage.getItem(storageKey);
                    if (saved) {
                        try { 
                            let parsed = JSON.parse(saved);
                            if (userRole !== 'Admin' && parsed.length > 12) {
                                parsed = parsed.slice(0, 12);
                            }
                            setRecords(parsed);
                        } catch (e) {
                            setRecords([]);
                        }
                    } else {
                        setRecords([]);
                    }
                }
            }, [isAuthenticated, loggedInUserId, userRole]);

            useEffect(() => {
                if (isAuthenticated && loggedInUserId) {
                    const storageKey = `user_private_records_${loggedInUserId}`;
                    localStorage.setItem(storageKey, JSON.stringify(records));
                }
            }, [records, isAuthenticated, loggedInUserId]);

            useEffect(() => {
                fetchDropdownOptions();
            }, []);

            useEffect(() => {
                if (isAuthenticated && userRole !== 'Admin' && loggedInUserId) {
                    handleFetchDataForId(loggedInUserId);
                }
            }, [isAuthenticated, userRole, loggedInUserId]);

            const getFirstName = (nameStr) => {
                if (!nameStr) return '';
                return nameStr.trim().split(' ')[0].toUpperCase();
            };

            const fetchDropdownOptions = async () => {
                setIsLoadingOptions(true);
                try {
                    const data = await jsonpRequest({ action: 'getDropdownOptions' });
                    if (data.status === 'success') {
                        setLocations(data.locations || []);
                        setEventTypes(data.eventTypes || []);
                        setBeneficiaryCategories(data.beneficiaryCategories || []);
                        
                        const fetchedGlCodes = data.glCodes || [];
                        const fetchedCostCenters = data.costCenters || [];
                        
                        setGlCodes(fetchedGlCodes);
                        setCostCenters(fetchedCostCenters);

                        setFormData(prev => ({
                            ...prev,
                            glCode: prev.glCode || (fetchedGlCodes.length > 0 ? fetchedGlCodes[0] : ''),
                            costCenter: prev.costCenter || (fetchedCostCenters.length > 0 ? fetchedCostCenters[0] : '')
                        }));
                    }
                } catch (err) {
                    console.error('Error fetching dropdown options:', err);
                } finally {
                    setIsLoadingOptions(false);
                }
            };

            const fetchAdminRecords = async () => {
                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ action: 'getAllRecords' });
                    if (res.status === 'success') {
                        setAllAdminRecords(res.data || []);
                        setSelectedRows([]);
                    }
                } catch (e) {
                    showToast('❌ Error loading sheet records.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 4500);
            };

            const isValidDDMMYY = (dateStr) => {
                const regex = /^(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.\d{2}$/;
                return regex.test(dateStr);
            };

            const cleanDDMMYY = (rawDateStr) => {
                if (!rawDateStr) return '';
                return rawDateStr.replace(/\./g, '');
            };

            const parseDDMMYYToDate = (dateStr) => {
                if (!isValidDDMMYY(dateStr)) return null;
                const parts = dateStr.split('.');
                const day = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const year = 2000 + parseInt(parts[2], 10);
                return new Date(year, month, day);
            };

            const calculateDayGap = (eventDateStr) => {
                const parsedEventDate = parseDDMMYYToDate(eventDateStr);
                if (!parsedEventDate) return 0;
                
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                parsedEventDate.setHours(0, 0, 0, 0);

                const diffTime = today.getTime() - parsedEventDate.getTime();
                return Math.floor(diffTime / (1000 * 60 * 60 * 24));
            };

            const handleEventDateChange = (e) => {
                let val = e.target.value.replace(/[^0-9.]/g, '');
                if (/^\d{6}$/.test(val)) {
                    val = `${val.slice(0, 2)}.${val.slice(2, 4)}.${val.slice(4, 6)}`;
                }
                setFormData(prev => ({ ...prev, eventDate: val }));
            };

            const formatCleanRefNo = (rawRefStr, eventDateVal) => {
                if (!rawRefStr) return '';
                const cleanDate = cleanDDMMYY(eventDateVal);
                
                if (rawRefStr.includes('-')) {
                    const parts = rawRefStr.split('-');
                    const seq = parts[parts.length - 1];
                    if (cleanDate) {
                        return `${cleanDate}-${seq}`;
                    }
                    return parts.slice(-2).join('-');
                }
                return rawRefStr;
            };

            const generateRefNumber = (empIdVal, eventDateVal, localRecords, adminRecords) => {
                const formattedDate = cleanDDMMYY(eventDateVal);
                const sourceList = userRole === 'Admin' && adminRecords.length > 0 ? adminRecords : localRecords;

                const matchingEntries = sourceList.filter(rec => 
                    String(rec.empId || '').trim() === String(empIdVal || '').trim() &&
                    cleanDDMMYY(rec.eventDate) === formattedDate
                );

                const sequenceNum = matchingEntries.length + 1;
                const formattedSeq = sequenceNum < 10 ? `0${sequenceNum}` : `${sequenceNum}`;

                return `${formattedDate}-${formattedSeq}`;
            };

            const jsonpRequest = (params, retries = 3) => {
                return new Promise((resolve, reject) => {
                    const attempt = (remainingRetries) => {
                        const callbackName = 'jsonp_cb_' + Math.round(1000000 * Math.random());
                        
                        const timeoutId = setTimeout(() => {
                            cleanup();
                            if (remainingRetries > 0) {
                                attempt(remainingRetries - 1);
                            } else {
                                reject(new Error('Server response timed out. Please try again.'));
                            }
                        }, 25000);

                        const cleanup = () => {
                            clearTimeout(timeoutId);
                            delete window[callbackName];
                            if (script && script.parentNode) {
                                script.parentNode.removeChild(script);
                            }
                        };

                        window[callbackName] = (data) => {
                            cleanup();
                            resolve(data);
                        };

                        const queryParams = new URLSearchParams({
                            ...params,
                            callback: callbackName
                        }).toString();

                        const script = document.createElement('script');
                        script.src = `${API_URL}?${queryParams}`;
                        script.onerror = () => {
                            cleanup();
                            if (remainingRetries > 0) {
                                attempt(remainingRetries - 1);
                            } else {
                                reject(new Error('Script execution error. Check API deployment.'));
                            }
                        };

                        document.body.appendChild(script);
                    };

                    attempt(retries);
                });
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsAuthenticating(true);
                setAuthError('');

                try {
                    const cleanUserId = credentials.userId.trim();
                    const data = await jsonpRequest({
                        action: 'login',
                        userId: cleanUserId,
                        password: credentials.password.trim()
                    });

                    if (data.status === 'success') {
                        const role = data.role || 'Normal';
                        const fetchedUserName = data.userName || '';

                        setIsAuthenticated(true);
                        setUserRole(role);
                        setLoggedInUserId(cleanUserId);
                        setLoggedInUserName(fetchedUserName);

                        sessionStorage.setItem('portal_user_id', cleanUserId);
                        sessionStorage.setItem('portal_user_role', role);
                        sessionStorage.setItem('portal_user_name', fetchedUserName);

                        if (role === 'Admin') {
                            fetchAdminRecords();
                        }

                        setFormData({
                            empId: role !== 'Admin' ? cleanUserId : '',
                            fullName: '',
                            department: '',
                            email: '',
                            location: '',
                            eventType: '',
                            beneficiaryCategory: '',
                            contributionAmt: '',
                            eventDate: '',
                            beneficiaryName: '',
                            ioNo: '',
                            glCode: glCodes.length > 0 ? glCodes[0] : '',
                            costCenter: costCenters.length > 0 ? costCenters[0] : '',
                            notes: '',
                            hasExceptionApproval: false
                        });
                    } else {
                        setAuthError('❌ Invalid User ID or Password.');
                    }
                } catch (err) {
                    setAuthError('❌ Network connection error. Please try logging in again.');
                } finally {
                    setIsAuthenticating(false);
                }
            };

            const handleLogout = () => {
                sessionStorage.clear();
                setIsAuthenticated(false);
                setUserRole('Normal');
                setLoggedInUserId('');
                setLoggedInUserName('');
                setCredentials({ userId: '', password: '' });
                setRecords([]);

                setFormData({
                    empId: '', fullName: '', department: '', email: '', location: '',
                    eventType: '', beneficiaryCategory: '', contributionAmt: '',
                    eventDate: '', beneficiaryName: '', ioNo: '', glCode: '', costCenter: '', notes: '',
                    hasExceptionApproval: false
                });
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleEmpIdChange = (e) => {
                if (userRole !== 'Admin') return;
                const numericValue = e.target.value.replace(/\D/g, '');
                setFormData(prev => ({ 
                    ...prev, 
                    empId: numericValue,
                    fullName: '',
                    department: '',
                    email: ''
                }));
            };

            const handleAdminIoChange = (rowIndex, val) => {
                setAllAdminRecords(prev => prev.map(item => item.rowIndex === rowIndex ? { ...item, ioNo: val } : item));
            };

            const handleSelectRow = (rowIndex) => {
                setSelectedRows(prev => 
                    prev.includes(rowIndex) ? prev.filter(id => id !== rowIndex) : [...prev, rowIndex]
                );
            };

            const handleSelectAll = () => {
                if (selectedRows.length === allAdminRecords.length) {
                    setSelectedRows([]);
                } else {
                    setSelectedRows(allAdminRecords.map(r => r.rowIndex));
                }
            };

            const handleFetchDataForId = async (empIdToFetch) => {
                if (!empIdToFetch) return;

                setIsFetchingEmp(true);
                try {
                    const data = await jsonpRequest({
                        action: 'getEmpName',
                        empId: empIdToFetch.trim()
                    });

                    if (data.status === 'success') {
                        setFormData(prev => ({ 
                            ...prev, 
                            fullName: data.empFullName || '',
                            department: data.department || '',
                            email: data.email || ''
                        }));
                        showToast('✅ Employee data captured from server!');
                    } else {
                        setFormData(prev => ({ 
                            ...prev, 
                            fullName: '',
                            department: '',
                            email: ''
                        }));
                        showToast('⚠️ Employee record not found.');
                    }
                } catch (err) {
                    showToast('❌ Error fetching employee data.');
                } finally {
                    setIsFetchingEmp(false);
                }
            };

            const handleFetchData = () => {
                const targetId = userRole === 'Admin' ? formData.empId : loggedInUserId;
                if (!targetId) {
                    showToast('⚠️ Please enter an EMP ID first.');
                    return;
                }
                handleFetchDataForId(targetId);
            };

            const handleAdminUpdate = async (rec) => {
                if (rec.isValidated) {
                    showToast('⚠️ Row already validated!');
                    return;
                }

                if (!rec.ioNo || rec.ioNo.trim() === '') {
                    showToast('❌ IO NO is compulsory for validation!');
                    return;
                }

                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ 
                        action: 'updateRecord', 
                        rowIndex: rec.rowIndex,
                        ioNo: rec.ioNo ? rec.ioNo.trim() : ''
                    });
                    if (res.status === 'success') {
                        showToast('✅ Record Validated & Added to Uploader!');
                        fetchAdminRecords();
                    } else {
                        showToast(`⚠️ ${res.message}`);
                    }
                } catch (e) {
                    showToast('❌ Failed to update record');
                } finally {
                    setIsSyncing(false);
                }
            };

            // TRIGGER LOCAL PYTHON SCRIPT AUTOMATICALLY
            const handlePostSapGui = async (rec) => {
                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ 
                        action: 'postSapGui', 
                        rowIndex: rec.rowIndex
                    });
                    if (res.status === 'success') {
                        showToast('🚀 Status set to "Ready for SAP". Triggering local SAP Bot...');
                        fetchAdminRecords();

                        try {
                            const localRes = await fetch('http://127.0.0.1:5000/run-sap', { method: 'POST' });
                            const localData = await localRes.json();
                            if (localData.status === 'success') {
                                showToast('🤖 Local SAP Bot execution started!');
                            }
                        } catch (err) {
                            showToast('⚠️ Status updated in sheet, but Local SAP Bridge is not running on PC.');
                        }
                    } else {
                        showToast(`⚠️ ${res.message}`);
                    }
                } catch (e) {
                    showToast('❌ Failed to update SAP GUI status');
                } finally {
                    setIsSyncing(false);
                }
            };

            // BULK TRIGGER FOR LOCAL PYTHON SCRIPT
            const handleBulkPostSapGui = async () => {
                if (selectedRows.length === 0) {
                    showToast('⚠️ Please select at least one validated row for SAP GUI Posting.');
                    return;
                }

                const validatedSelected = allAdminRecords.filter(r => selectedRows.includes(r.rowIndex) && r.isValidated);

                if (validatedSelected.length === 0) {
                    showToast('⚠️ None of the selected rows are validated yet.');
                    return;
                }

                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({
                        action: 'bulkPostSapGui',
                        rowIndices: JSON.stringify(validatedSelected.map(r => r.rowIndex))
                    });

                    if (res.status === 'success') {
                        showToast(`🚀 ${res.message} Triggering local SAP Bot...`);
                        fetchAdminRecords();

                        try {
                            const localRes = await fetch('http://127.0.0.1:5000/run-sap', { method: 'POST' });
                            const localData = await localRes.json();
                            if (localData.status === 'success') {
                                showToast('🤖 Local SAP Bot started for selected claims!');
                            }
                        } catch (err) {
                            showToast('⚠️ Status updated in sheet, but Local SAP Bridge is not running on PC.');
                        }
                    } else {
                        showToast('❌ Bulk SAP GUI Posting failed.');
                    }
                } catch (e) {
                    showToast('❌ Error executing bulk SAP GUI Posting.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleBulkValidate = async () => {
                if (selectedRows.length === 0) {
                    showToast('⚠️ Please select at least one row to validate.');
                    return;
                }

                const recordsToValidate = allAdminRecords.filter(r => selectedRows.includes(r.rowIndex) && !r.isValidated);

                const missingIo = recordsToValidate.some(r => !r.ioNo || r.ioNo.trim() === '');
                if (missingIo) {
                    showToast('❌ All selected rows must have a valid IO NO filled before bulk validation!');
                    return;
                }

                if (recordsToValidate.length === 0) {
                    showToast('⚠️ Selected row(s) are already validated.');
                    return;
                }

                setIsSyncing(true);
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'bulkValidateRecords',
                            records: recordsToValidate
                        })
                    }).then(r => r.json());

                    if (res.status === 'success') {
                        showToast(`✅ ${res.message}`);
                        fetchAdminRecords();
                    } else {
                        showToast('❌ Bulk validation failed.');
                    }
                } catch (e) {
                    showToast('❌ Error performing bulk validation.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleBulkDelete = async () => {
                if (selectedRows.length === 0) {
                    showToast('⚠️ Please select at least one row to delete.');
                    return;
                }

                if (!confirm(`Are you sure you want to delete ${selectedRows.length} selected row(s) from Google Sheet?`)) return;

                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({
                        action: 'bulkDeleteRecords',
                        rowIndices: JSON.stringify(selectedRows)
                    });

                    if (res.status === 'success') {
                        showToast(`🗑️ ${res.message}`);
                        fetchAdminRecords();
                    } else {
                        showToast('❌ Bulk deletion failed.');
                    }
                } catch (e) {
                    showToast('❌ Error performing bulk deletion.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleAdminDelete = async (rowIndex) => {
                if (!confirm('Are you sure you want to delete this row from Google Sheet?')) return;
                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ action: 'deleteRecord', rowIndex });
                    if (res.status === 'success') {
                        showToast('🗑️ Record Deleted from Sheet!');
                        fetchAdminRecords();
                    }
                } catch (e) {
                    showToast('❌ Failed to delete record');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!formData.fullName || !formData.email || !formData.empId || !formData.eventDate) {
                    showToast('⚠️ Please fill in all required fields including Event Date.');
                    return;
                }

                if (!isValidDDMMYY(formData.eventDate)) {
                    showToast('❌ Invalid Date Format! Please enter in DD.MM.YY format (e.g. 10.10.26)');
                    return;
                }

                const checkSource = userRole === 'Admin' && allAdminRecords.length > 0 ? allAdminRecords : records;

                const isStrictDuplicate = checkSource.some(rec => 
                    String(rec.empId || '').trim() === String(formData.empId || '').trim() &&
                    cleanDDMMYY(rec.eventDate) === cleanDDMMYY(formData.eventDate) &&
                    rec.beneficiaryName.trim().toLowerCase() === formData.beneficiaryName.trim().toLowerCase() &&
                    rec.beneficiaryName.trim() !== ""
                );

                if (isStrictDuplicate) {
                    showToast('❌ Submission Blocked: You have already submitted data for this Event Date and Beneficiary Name!');
                    return;
                }

                const daysGap = calculateDayGap(formData.eventDate);
                if (daysGap > 15 && !formData.hasExceptionApproval) {
                    setPendingDelayDays(daysGap);
                    setDelayWarningModal(true);
                    return;
                }

                const hasSameDateEntry = checkSource.some(rec => 
                    String(rec.empId || '').trim() === String(formData.empId || '').trim() &&
                    cleanDDMMYY(rec.eventDate) === cleanDDMMYY(formData.eventDate)
                );

                if (hasSameDateEntry) {
                    setSameDateWarningModal(true);
                    return;
                }

                executeSubmission(formData.hasExceptionApproval);
            };

            const handleConfirmDelayException = () => {
                setFormData(prev => ({ ...prev, hasExceptionApproval: true }));
                setDelayWarningModal(false);

                const checkSource = userRole === 'Admin' && allAdminRecords.length > 0 ? allAdminRecords : records;
                const hasSameDateEntry = checkSource.some(rec => 
                    String(rec.empId || '').trim() === String(formData.empId || '').trim() &&
                    cleanDDMMYY(rec.eventDate) === cleanDDMMYY(formData.eventDate)
                );

                if (hasSameDateEntry) {
                    setSameDateWarningModal(true);
                } else {
                    executeSubmission(true);
                }
            };

            const executeSubmission = async (exceptionApprovalState = formData.hasExceptionApproval) => {
                setIsSyncing(true);
                setSameDateWarningModal(false);

                const timestamp = new Date().toLocaleString();
                const refNumber = generateRefNumber(formData.empId, formData.eventDate, records, allAdminRecords);

                const newRecord = { 
                    id: Date.now(), 
                    refNumber, 
                    timestamp, 
                    ...formData,
                    hasExceptionApproval: exceptionApprovalState
                };

                try {
                    await jsonpRequest({
                        action: 'submit',
                        timestamp: timestamp,
                        empId: formData.empId,
                        fullName: formData.fullName,
                        department: formData.department,
                        email: formData.email,
                        location: formData.location,
                        eventType: formData.eventType,
                        eventDate: formData.eventDate,
                        beneficiaryCategory: formData.beneficiaryCategory,
                        beneficiaryName: formData.beneficiaryName,
                        contributionAmt: formData.contributionAmt,
                        refNumber: refNumber,
                        notes: formData.notes,
                        glCode: formData.glCode,
                        costCenter: formData.costCenter,
                        ioNo: formData.ioNo,
                        hasExceptionApproval: exceptionApprovalState ? 'Yes' : 'No'
                    });

                    setRecords(prev => {
                        const updated = [newRecord, ...prev];
                        if (userRole !== 'Admin' && updated.length > 12) {
                            return updated.slice(0, 12);
                        }
                        return updated;
                    });

                    showToast(`✅ Synced! Ref No: ${refNumber}`);
                    
                    setPdfData(newRecord);
                    if (userRole === 'Admin') fetchAdminRecords();

                    setFormData(prev => ({
                        empId: userRole !== 'Admin' ? loggedInUserId : '',
                        fullName: userRole !== 'Admin' ? prev.fullName : '',
                        department: userRole !== 'Admin' ? prev.department : '',
                        email: userRole !== 'Admin' ? prev.email : '',
                        location: '',
                        eventType: '',
                        beneficiaryCategory: '',
                        contributionAmt: '',
                        eventDate: '',
                        beneficiaryName: '',
                        ioNo: '',
                        glCode: glCodes.length > 0 ? glCodes[0] : '',
                        costCenter: costCenters.length > 0 ? costCenters[0] : '',
                        notes: '',
                        hasExceptionApproval: false
                    }));
                } catch (err) {
                    showToast('❌ Error submitting data.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleDirectPrint = () => {
                const printContainer = document.getElementById('print-root');
                const receiptElement = document.getElementById('printable-receipt');
                
                if (printContainer && receiptElement) {
                    printContainer.innerHTML = receiptElement.outerHTML;
                    window.print();
                    printContainer.innerHTML = '';
                }
            };

            const handleSavePDF = () => {
                if (!pdfData) return;
                const element = document.getElementById('printable-receipt');
                const opt = {
                    margin:       0.3,
                    filename:     `Claim_Form_${pdfData.empId}_${formatCleanRefNo(pdfData.refNumber, pdfData.eventDate) || pdfData.id}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save();
            };

            const confirmClearRecords = () => {
                if (userRole !== 'Admin') return;
                setRecords([]);
                if (loggedInUserId) {
                    localStorage.removeItem(`user_private_records_${loggedInUserId}`);
                }
                setShowConfirmModal(false);
                showToast('🧹 History cleared!');
            };

            const exportToExcel = () => {
                if (records.length === 0) {
                    showToast('⚠️ No records to export!');
                    return;
                }
                const exportData = records.map(({ id, refNumber, eventDate, ...rest }) => ({
                    refNumber: formatCleanRefNo(refNumber, eventDate),
                    eventDate,
                    ...rest
                }));
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "My Submissions");
                XLSX.writeFile(workbook, "My_Submissions_Export.xlsx");
                showToast('📊 Exported to Excel successfully!');
            };

            if (!isAuthenticated) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl">
                            <div className="flex flex-col items-center mb-6">
                                <img src="logo.png" alt="Logo" className="h-9 mb-3 object-contain" />
                                <h2 className="text-xl font-bold text-cyan-400"> Sales Promotion claim portal </h2>
                                <p className="text-xs text-slate-400 mt-1">Sign in with your credentials</p>
                            </div>

                            {authError && (
                                <div className="mb-4 bg-rose-900/40 border border-rose-500/50 text-rose-300 text-xs p-3 rounded text-center">
                                    {authError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div className="flex items-center space-x-3">
                                    <label className="w-24 text-sm font-bold text-slate-200">User ID:</label>
                                    <input 
                                        type="text" 
                                        required
                                        value={credentials.userId}
                                        onChange={(e) => setCredentials(p => ({ ...p, userId: e.target.value }))}
                                        className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                        placeholder="Enter User ID"
                                    />
                                </div>

                                <div className="flex items-center space-x-3">
                                    <label className="w-24 text-sm font-bold text-slate-200">Password:</label>
                                    <input 
                                        type="password" 
                                        required
                                        value={credentials.password}
                                        onChange={(e) => setCredentials(p => ({ ...p, password: e.target.value }))}
                                        className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                        placeholder="Enter Password"
                                    />
                                </div>

                                <button 
                                    type="submit"
                                    disabled={isAuthenticating}
                                    className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded transition-all shadow-lg disabled:opacity-50 text-sm mt-4"
                                >
                                    {isAuthenticating ? 'Verifying Credentials...' : 'Sign In'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-[95%] mx-auto p-6">
                    {/* TOP HEADER SECTION */}
                    <div className="flex justify-between items-center mb-8 no-print flex-wrap gap-4">
                        <div className="relative group">
                            <div className="absolute -inset-1 bg-gradient-to-r from-cyan-500 via-teal-400 to-blue-600 rounded-2xl blur-md opacity-70 group-hover:opacity-100 transition duration-500"></div>
                            
                            <div className="relative px-5 py-3 bg-slate-950/90 backdrop-blur-xl border border-cyan-500/50 rounded-2xl shadow-2xl flex items-center space-x-3">
                                <img src="logo.png" alt="Logo" className="h-10 w-auto object-contain bg-white/90 p-1 rounded-lg" />
                                <div>
                                    <h1 className="text-xl sm:text-2xl font-black tracking-tight bg-gradient-to-r from-cyan-300 via-teal-200 to-blue-400 bg-clip-text text-transparent uppercase">
                                        Sales Promotion Claim
                                    </h1>
                                    <div className="flex items-center space-x-2 mt-0.5">
                                        <span className="h-1.5 w-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                                        <p className="text-[10px] font-bold tracking-widest text-cyan-400/80 uppercase">
                                            Role: <span className="text-amber-300">{userRole}</span> ({loggedInUserId})
                                            {loggedInUserName && (
                                                <span className="text-emerald-300"> - "{getFirstName(loggedInUserName)}"</span>
                                            )}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center space-x-3">
                            {userRole === 'Admin' && records.length > 0 && (
                                <button 
                                    type="button"
                                    onClick={() => setShowConfirmModal(true)}
                                    className="bg-rose-600 hover:bg-rose-500 text-xs font-semibold px-3 py-2 rounded transition-all text-white shadow"
                                >
                                    🗑️ Clear My History
                                </button>
                            )}
                            <button 
                                type="button"
                                onClick={exportToExcel}
                                className="bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold px-4 py-2 rounded transition-all text-white shadow"
                            >
                                📊 Export Excel
                            </button>
                            <button 
                                type="button"
                                onClick={handleLogout}
                                className="bg-slate-700 hover:bg-slate-600 text-xs font-semibold px-3 py-2 rounded transition-all text-slate-200 border border-slate-600 shadow"
                            >
                                🚪 Logout
                            </button>
                        </div>
                    </div>

                    {toast && (
                        <div className="fixed top-5 right-5 bg-slate-800 border border-cyan-500 text-slate-100 px-4 py-3 rounded shadow-2xl z-50 animate-bounce text-sm no-print">
                            {toast}
                        </div>
                    )}

                    {/* ADMIN DASHBOARD */}
                    {userRole === 'Admin' && (
                        <div className="bg-slate-800 p-6 rounded-xl border border-amber-500/40 shadow-xl mb-8 no-print">
                            <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                                <div>
                                    <h2 className="text-xl font-bold text-amber-300 flex items-center space-x-2">
                                        <span>👑 Admin Validation Dashboard</span>
                                    </h2>
                                    <p className="text-xs text-slate-400 mt-0.5">Validate, post, or delete records individually or in bulk.</p>
                                </div>
                                
                                <div className="flex items-center space-x-2 flex-wrap gap-2">
                                    <button 
                                        onClick={handleBulkValidate}
                                        disabled={selectedRows.length === 0 || isSyncing}
                                        className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-bold px-3 py-2 rounded transition-all shadow flex items-center space-x-1"
                                    >
                                        <span>✅ Validate ({selectedRows.length})</span>
                                    </button>

                                    <button 
                                        onClick={handleBulkPostSapGui}
                                        disabled={selectedRows.length === 0 || isSyncing}
                                        className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white text-xs font-bold px-3 py-2 rounded transition-all shadow flex items-center space-x-1"
                                    >
                                        <span>🚀 Post SAP GUI ({selectedRows.length})</span>
                                    </button>

                                    <button 
                                        onClick={handleBulkDelete}
                                        disabled={selectedRows.length === 0 || isSyncing}
                                        className="bg-rose-700 hover:bg-rose-600 disabled:opacity-50 text-white text-xs font-bold px-3 py-2 rounded transition-all shadow flex items-center space-x-1"
                                    >
                                        <span>🗑️ Delete ({selectedRows.length})</span>
                                    </button>

                                    <button 
                                        onClick={fetchAdminRecords} 
                                        className="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-3 py-2 rounded transition-all shadow"
                                    >
                                        {isSyncing ? 'Refreshing...' : '🔄 Refresh Data'}
                                    </button>
                                </div>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-xs text-left text-slate-300 border-collapse">
                                    <thead className="text-[11px] uppercase bg-slate-900 text-cyan-400 font-bold">
                                        <tr>
                                            <th className="px-3 py-2.5 text-center">
                                                <input 
                                                    type="checkbox" 
                                                    onChange={handleSelectAll} 
                                                    checked={selectedRows.length > 0 && selectedRows.length === allAdminRecords.length}
                                                    className="rounded cursor-pointer"
                                                />
                                            </th>
                                            <th className="px-3 py-2.5">GS.No</th>
                                            <th className="px-3 py-2.5">REF NO</th>
                                            <th className="px-3 py-2.5">EMP ID</th>
                                            <th className="px-3 py-2.5">Name</th>
                                            <th className="px-3 py-2.5">Event Date</th>
                                            <th className="px-3 py-2.5">Beneficiary Name</th>
                                            <th className="px-3 py-2.5">Amt</th>
                                            <th className="px-3 py-2.5">IO NO *</th>
                                            <th className="px-3 py-2.5">Duplicate</th>
                                            <th className="px-3 py-2.5">Validation</th>
                                            <th className="px-3 py-2.5 text-center">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700">
                                        {allAdminRecords.length === 0 ? (
                                            <tr>
                                                <td colSpan="12" className="text-center py-6 text-slate-400 italic">No submissions found in Google Sheet.</td>
                                            </tr>
                                        ) : (
                                            allAdminRecords.map((rec) => (
                                                <tr key={rec.rowIndex} className={`hover:bg-slate-750 transition-colors ${rec.isValidated ? 'bg-slate-900/60 opacity-80' : ''}`}>
                                                    <td className="px-3 py-2 text-center">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={selectedRows.includes(rec.rowIndex)}
                                                            onChange={() => handleSelectRow(rec.rowIndex)}
                                                            className="rounded cursor-pointer"
                                                        />
                                                    </td>
                                                    <td className="px-3 py-2 font-mono text-slate-400 font-bold">{rec.gsNo}</td>
                                                    <td className="px-3 py-2 font-mono text-cyan-400 font-bold">{formatCleanRefNo(rec.refNumber, rec.eventDate) || '-'}</td>
                                                    <td className="px-3 py-2 font-mono text-cyan-300 font-bold">{rec.empId}</td>
                                                    <td className="px-3 py-2 font-medium text-white">{rec.fullName}</td>
                                                    <td className="px-3 py-2 font-mono">{rec.eventDate}</td>
                                                    <td className="px-3 py-2">{rec.beneficiaryName || '-'}</td>
                                                    <td className="px-3 py-2 font-bold text-amber-300">₹{rec.contributionAmt}</td>
                                                    <td className="px-3 py-2">
                                                        <input 
                                                            type="text" 
                                                            disabled={rec.isValidated}
                                                            value={rec.ioNo || ''} 
                                                            onChange={(e) => handleAdminIoChange(rec.rowIndex, e.target.value)}
                                                            placeholder="IO NO (Required)"
                                                            required
                                                            className={`w-32 border rounded px-2 py-1 font-mono text-xs focus:outline-none disabled:opacity-50 disabled:bg-slate-800 ${
                                                                !rec.ioNo ? 'bg-slate-900 border-rose-500/80 text-rose-300 placeholder-rose-400/60' : 'bg-slate-900 border-slate-600 focus:border-cyan-400 text-cyan-300'
                                                            }`}
                                                        />
                                                    </td>
                                                    <td className="px-3 py-2">
                                                        {rec.dupStatus === 'BLOCK_REJECT' ? (
                                                            <span className="bg-rose-900/80 text-rose-200 border border-rose-500/60 px-2 py-0.5 rounded text-[10px] font-bold inline-block" title={rec.dupMessage}>
                                                                ❌ REJECT (Exact Duplicate)
                                                            </span>
                                                        ) : rec.dupStatus === 'WARN_ALLOW' ? (
                                                            <span className="bg-amber-900/80 text-amber-200 border border-amber-500/60 px-2 py-0.5 rounded text-[10px] font-bold inline-block" title={rec.dupMessage}>
                                                                ⚠️ ALLOW (Same Date)
                                                            </span>
                                                        ) : (
                                                            <span className="bg-emerald-900/80 text-emerald-200 border border-emerald-500/60 px-2 py-0.5 rounded text-[10px] font-bold inline-block">
                                                                ✅ CLEAR
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td className="px-3 py-2 font-semibold">
                                                        {rec.isValidated ? (
                                                            <span className="text-emerald-400 flex items-center space-x-1 font-bold">
                                                                <span>🔒</span>
                                                                <span>{rec.sapStatus === 'Ready for SAP' ? 'Ready for SAP' : 'Validated'}</span>
                                                            </span>
                                                        ) : (
                                                            <span className="text-amber-400 font-bold">Pending</span>
                                                        )}
                                                    </td>
                                                    <td className="px-3 py-2 text-center space-x-1 whitespace-nowrap">
                                                        <button 
                                                            onClick={() => handleAdminUpdate(rec)} 
                                                            disabled={rec.isValidated || rec.dupStatus === 'BLOCK_REJECT'}
                                                            className="bg-emerald-700 hover:bg-emerald-600 disabled:bg-slate-700 disabled:text-slate-500 text-white px-2.5 py-1 rounded text-[10px] font-bold shadow transition-all disabled:cursor-not-allowed"
                                                        >
                                                            {rec.isValidated ? 'Locked' : 'Validate'}
                                                        </button>

                                                        <button 
                                                            onClick={() => handlePostSapGui(rec)} 
                                                            disabled={!rec.isValidated || rec.sapStatus === 'Ready for SAP'}
                                                            className="bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500 text-white px-2.5 py-1 rounded text-[10px] font-bold shadow transition-all disabled:cursor-not-allowed"
                                                        >
                                                            Post (SAP GUI)
                                                        </button>

                                                        <button 
                                                            onClick={() => handleAdminDelete(rec.rowIndex)} 
                                                            className="bg-rose-700 hover:bg-rose-600 text-white px-2.5 py-1 rounded text-[10px] font-bold shadow transition-all"
                                                        >
                                                            Delete
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* MODAL 1: CONFIRM CLEAR LOCAL HISTORY */}
                    {showConfirmModal && userRole === 'Admin' && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4 no-print">
                            <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2 bg-rose-500/20 text-rose-400 rounded-lg">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                        </svg>
                                    </div>
                                    <h3 className="text-lg font-bold text-white">Clear Local History?</h3>
                                </div>
                                <p className="text-sm text-slate-300">This will clear your local view.</p>
                                <div className="flex justify-end space-x-3 pt-2">
                                    <button 
                                        type="button"
                                        onClick={() => setShowConfirmModal(false)}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 transition-all"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={confirmClearRecords}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white transition-all shadow"
                                    >
                                        Yes, Clear
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 2: SAME DATE ATTENDANCE WARNING */}
                    {sameDateWarningModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 no-print">
                            <div className="bg-slate-800 border border-amber-500/60 rounded-xl p-6 max-w-md w-full shadow-2xl space-y-4">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2 bg-amber-500/20 text-amber-400 rounded-lg">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                        </svg>
                                    </div>
                                    <h3 className="text-lg font-bold text-white">Event Attendance Confirmation</h3>
                                </div>
                                
                                <p className="text-sm text-slate-200 font-medium">
                                    Have you attended more than one event on same date?
                                </p>
                                <p className="text-xs text-slate-400">
                                    An earlier submission exists for EMP ID <span className="text-cyan-400 font-mono font-bold">{formData.empId}</span> on date <span className="text-cyan-400 font-mono font-bold">{formData.eventDate}</span>.
                                </p>

                                <div className="flex justify-end space-x-3 pt-3">
                                    <button 
                                        type="button"
                                        onClick={() => setSameDateWarningModal(false)}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 transition-all"
                                    >
                                        No (Cancel)
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={() => executeSubmission()}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white transition-all shadow"
                                    >
                                        Yes (Submit Data)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 3: 15 DAYS DELAY EXCEPTION APPROVAL MODAL */}
                    {delayWarningModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 no-print">
                            <div className="bg-slate-800 border border-amber-500/60 rounded-xl p-6 max-w-md w-full shadow-2xl space-y-4">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2 bg-amber-500/20 text-amber-400 rounded-lg">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                        </svg>
                                    </div>
                                    <h3 className="text-lg font-bold text-white">Claim Submission Delay Warning</h3>
                                </div>
                                
                                <div className="text-sm text-slate-200 space-y-2">
                                    <p className="font-semibold text-amber-300">
                                        Your claim submission period is above 15 days ({pendingDelayDays} days gap).
                                    </p>
                                    <p className="text-slate-300 text-xs">
                                        Have you taken exception approval? If Yes then continue, or Cancel submission.
                                    </p>
                                </div>

                                <div className="flex justify-end space-x-3 pt-3">
                                    <button 
                                        type="button"
                                        onClick={() => setDelayWarningModal(false)}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-rose-700 hover:bg-rose-600 text-white transition-all shadow"
                                    >
                                        Cancel Submission
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={handleConfirmDelayException}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white transition-all shadow"
                                    >
                                        Yes (Continue)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* RECEIPT PREVIEW MODAL */}
                    {pdfData && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto no-print">
                            <div className="bg-slate-800 border border-slate-700 rounded-xl max-w-2xl w-full p-6 shadow-2xl flex flex-col my-auto">
                                
                                <div className="flex justify-between items-center border-b border-slate-700 pb-3 mb-4 shrink-0">
                                    <h3 className="text-base font-bold text-cyan-400">Submission Receipt</h3>
                                    <div className="flex items-center space-x-2">
                                        <button 
                                            type="button"
                                            onClick={handleDirectPrint}
                                            className="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-3 py-1.5 rounded transition-all shadow flex items-center space-x-1"
                                        >
                                            <span>🖨️</span>
                                            <span>Print</span>
                                        </button>
                                        <button 
                                            type="button"
                                            onClick={handleSavePDF}
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded transition-all shadow flex items-center space-x-1"
                                        >
                                            <span>📥</span>
                                            <span>Save PDF</span>
                                        </button>
                                        <button 
                                            type="button"
                                            onClick={() => setPdfData(null)}
                                            className="bg-rose-700 hover:bg-rose-600 text-white text-xs font-bold px-3 py-1.5 rounded transition-all shadow flex items-center space-x-1"
                                        >
                                            <span>❌</span>
                                            <span>Close</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="overflow-y-auto max-h-[75vh] pr-1">
                                    <div id="printable-receipt" style={{ backgroundColor: '#ffffff', color: '#1e293b', padding: '32px', fontFamily: 'Arial, sans-serif', fontSize: '13px', borderRadius: '8px' }}>
                                        
                                        <table style={{ width: '100%', borderBottom: '2px solid #0284c7', paddingBottom: '12px', marginBottom: '24px' }}>
                                            <tbody>
                                                <tr>
                                                    <td style={{ verticalAlign: 'middle', width: '60px' }}>
                                                        <img src="logo.png" alt="Logo" style={{ height: '48px', width: 'auto', objectFit: 'contain' }} />
                                                    </td>
                                                    <td style={{ verticalAlign: 'top', paddingLeft: '12px' }}>
                                                        <h2 style={{ fontSize: '16px', fontWeight: 'bold', color: '#0f172a', margin: 0, letterSpacing: '0.2px' }}>
                                                            SALES PROMOTION CLAIM SUBMISSION FORM
                                                        </h2>
                                                        <p style={{ fontSize: '11px', color: '#64748b', marginTop: '4px', margin: 0 }}>Submitted On: {pdfData.timestamp}</p>
                                                    </td>
                                                    <td style={{ textAlign: 'right', verticalAlign: 'top' }}>
                                                        <p style={{ fontSize: '15px', fontWeight: 'bold', color: '#0284c7', margin: 0, fontFamily: 'monospace' }}>
                                                            REF NO: {formatCleanRefNo(pdfData.refNumber, pdfData.eventDate) || `#${pdfData.id}`}
                                                        </p>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>

                                        <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '24px' }}>
                                            <tbody>
                                                <tr>
                                                    <td style={{ width: '50%', padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>EMP ID:</strong> <span style={{ color: '#0f172a', fontWeight: 'bold' }}>{pdfData.empId}</span>
                                                    </td>
                                                    <td style={{ width: '50%', padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>Full Name:</strong> <span style={{ color: '#0f172a', fontWeight: 'bold' }}>{pdfData.fullName}</span>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td style={{ padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>Department:</strong> {pdfData.department || '-'}
                                                    </td>
                                                    <td style={{ padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>Email:</strong> {pdfData.email}
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td style={{ padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>Location:</strong> {pdfData.location || '-'}
                                                    </td>
                                                    <td style={{ padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>Event Type:</strong> {pdfData.eventType || '-'}
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td style={{ padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>Beneficiary Category:</strong> {pdfData.beneficiaryCategory || '-'}
                                                    </td>
                                                    <td style={{ padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>Contribution Amt:</strong> {pdfData.contributionAmt ? `₹${pdfData.contributionAmt}` : '-'}
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td style={{ padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>Event Date:</strong> {pdfData.eventDate || '-'}
                                                    </td>
                                                    <td style={{ padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>Beneficiary Name:</strong> {pdfData.beneficiaryName || '-'}
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td style={{ padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>Cost Center:</strong> {pdfData.costCenter || '-'}
                                                    </td>
                                                    <td style={{ padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }}>
                                                        <strong style={{ color: '#475569' }}>GL Code:</strong> {pdfData.glCode || '-'}
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td style={{ padding: '10px 6px', borderBottom: '1px solid #e2e8f0' }} colSpan="2">
                                                        <strong style={{ color: '#475569' }}>IO No:</strong> {pdfData.ioNo || '-'}
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>

                                        <div style={{ backgroundColor: '#f8fafc', padding: '12px 14px', border: '1px solid #cbd5e1', borderRadius: '6px', marginBottom: '20px' }}>
                                            <strong style={{ color: '#334155' }}>Notes:</strong> <span style={{ color: '#0f172a' }}>{pdfData.notes ? pdfData.notes : '-'}</span>
                                        </div>

                                        {pdfData.hasExceptionApproval && (
                                            <div style={{ backgroundColor: '#fef3c7', border: '1px solid #f59e0b', padding: '10px 14px', borderRadius: '6px', marginBottom: '20px', display: 'flex', itemsCenter: 'center' }}>
                                                <span style={{ fontSize: '14px', marginRight: '8px', border: '1px solid #d97706', padding: '1px 5px', borderRadius: '3px', backgroundColor: '#ffffff', fontWeight: 'bold' }}>☑</span>
                                                <span style={{ color: '#92400e', fontWeight: 'bold', fontSize: '12px' }}>
                                                    Exception approval of delay claim submission
                                                </span>
                                            </div>
                                        )}

                                        <div style={{ border: '1px solid #cbd5e1', backgroundColor: '#f8fafc', padding: '14px 16px', borderRadius: '6px', marginBottom: '24px' }}>
                                            <h4 style={{ fontSize: '11px', fontWeight: 'bold', textTransform: 'uppercase', color: '#1e293b', margin: '0 0 4px 0' }}>Declaration</h4>
                                            <p style={{ fontSize: '11px', color: '#334155', fontStyle: 'italic', margin: 0, lineHeight: '1.5' }}>
                                                I hereby declare that this event claim has not been claimed previously...
                                            </p>
                                        </div>

                                        <div style={{ marginTop: '40px', marginBottom: '30px', paddingLeft: '4px' }}>
                                            <p style={{ fontSize: '12px', fontWeight: 'bold', color: '#334155', margin: 0 }}>
                                                SAP Document No: <span style={{ borderBottom: '1px solid #94a3b8', display: 'inline-block', width: '220px', marginLeft: '8px' }}>&nbsp;</span>
                                            </p>
                                        </div>

                                        <div style={{ paddingTop: '30px', paddingBottom: '10px' }}>
                                            <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                                                <tbody>
                                                    <tr>
