<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Promotion Claim Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycbwDcANmvvvzWKurM8oeVqzky6oRl7-geRY3UZRQbnz1hFbNmVRcikvoUhqvqQ2AhmnMmg/exec";

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [credentials, setCredentials] = useState({ userId: '', password: '' });
            const [userRole, setUserRole] = useState('Admin');
            const [loggedInUserId, setLoggedInUserId] = useState('');
            
            const [allAdminRecords, setAllAdminRecords] = useState([]);
            const [selectedRows, setSelectedRows] = useState([]);
            const [isSyncing, setIsSyncing] = useState(false);
            const [toast, setToast] = useState('');

            useEffect(() => {
                const sessionUser = sessionStorage.getItem('portal_user_id');
                const sessionRole = sessionStorage.getItem('portal_user_role') || 'Admin';
                if (sessionUser) {
                    setIsAuthenticated(true);
                    setLoggedInUserId(sessionUser);
                    setUserRole(sessionRole);
                    if (sessionRole === 'Admin') fetchAdminRecords();
                } else {
                    setIsAuthenticated(true);
                    setUserRole('Admin');
                    fetchAdminRecords();
                }
            }, []);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 4500);
            };

            const jsonpRequest = (params) => {
                return new Promise((resolve, reject) => {
                    const callbackName = 'jsonp_cb_' + Math.round(1000000 * Math.random());
                    window[callbackName] = (data) => {
                        delete window[callbackName];
                        if (script && script.parentNode) script.parentNode.removeChild(script);
                        resolve(data);
                    };
                    const script = document.createElement('script');
                    script.src = `${API_URL}?${new URLSearchParams({ ...params, callback: callbackName }).toString()}`;
                    document.body.appendChild(script);
                });
            };

            const fetchAdminRecords = async () => {
                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ action: 'getAllRecords' });
                    if (res.status === 'success') {
                        setAllAdminRecords(res.data || []);
                        setSelectedRows([]);
                    }
                } catch (e) {
                    showToast('❌ Error loading sheet records.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleAdminIoChange = (rowIndex, val) => {
                setAllAdminRecords(prev => prev.map(item => item.rowIndex === rowIndex ? { ...item, ioNo: val } : item));
            };

            const handleSelectRow = (rowIndex) => {
                setSelectedRows(prev => 
                    prev.includes(rowIndex) ? prev.filter(id => id !== rowIndex) : [...prev, rowIndex]
                );
            };

            const handleSelectAll = () => {
                const pendingRows = allAdminRecords.filter(r => !r.isValidated).map(r => r.rowIndex);
                if (selectedRows.length === pendingRows.length) {
                    setSelectedRows([]);
                } else {
                    setSelectedRows(pendingRows);
                }
            };

            // Single Row Validation
            const handleAdminUpdate = async (rec) => {
                if (rec.isValidated) {
                    showToast('⚠️ Row already validated!');
                    return;
                }
                setIsSyncing(true);
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'updateRecord',
                            rowIndex: rec.rowIndex,
                            ioNo: rec.ioNo || ''
                        })
                    }).then(r => r.json());

                    if (res.status === 'success') {
                        showToast(`✅ ${res.message}`);
                        fetchAdminRecords();
                    } else {
                        showToast(`⚠️ ${res.message}`);
                    }
                } catch (e) {
                    showToast('❌ Failed to update record.');
                } finally {
                    setIsSyncing(false);
                }
            };

            // Bulk Row Validation
            const handleBulkValidate = async () => {
                if (selectedRows.length === 0) {
                    showToast('⚠️ Please select at least one row to validate.');
                    return;
                }

                const recordsToValidate = allAdminRecords.filter(r => selectedRows.includes(r.rowIndex) && !r.isValidated);

                if (recordsToValidate.length === 0) {
                    showToast('⚠️ Selected row(s) are already validated.');
                    return;
                }

                setIsSyncing(true);
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'bulkValidateRecords',
                            records: recordsToValidate
                        })
                    }).then(r => r.json());

                    if (res.status === 'success') {
                        showToast(`✅ ${res.message}`);
                        fetchAdminRecords();
                    } else {
                        showToast('❌ Bulk validation failed.');
                    }
                } catch (e) {
                    showToast('❌ Error performing bulk validation.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleAdminDelete = async (rowIndex) => {
                if (!confirm('Are you sure you want to delete this row?')) return;
                setIsSyncing(true);
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'deleteRecord', rowIndex })
                    }).then(r => r.json());

                    if (res.status === 'success') {
                        showToast('🗑️ Record Deleted!');
                        fetchAdminRecords();
                    }
                } catch (e) {
                    showToast('❌ Failed to delete record.');
                } finally {
                    setIsSyncing(false);
                }
            };

            return (
                <div className="max-w-[95%] mx-auto p-6">
                    {toast && (
                        <div className="fixed top-5 right-5 bg-slate-800 border border-cyan-500 text-slate-100 px-4 py-3 rounded shadow-2xl z-50 animate-bounce text-sm">
                            {toast}
                        </div>
                    )}

                    <div className="bg-slate-800 p-6 rounded-xl border border-amber-500/40 shadow-xl mb-8">
                        <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                            <div>
                                <h2 className="text-xl font-bold text-amber-300 flex items-center space-x-2">
                                    <span>👑 Admin Validation Dashboard</span>
                                </h2>
                                <p className="text-xs text-slate-400 mt-0.5">Validate records individually or in bulk. Once validated, records are locked and pushed to Uploader.</p>
                            </div>
                            
                            <div className="flex items-center space-x-3">
                                <button 
                                    onClick={handleBulkValidate}
                                    disabled={selectedRows.length === 0 || isSyncing}
                                    className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-bold px-4 py-2 rounded transition-all shadow flex items-center space-x-1.5"
                                >
                                    <span>✅</span>
                                    <span>Validate Selected ({selectedRows.length})</span>
                                </button>
                                <button 
                                    onClick={fetchAdminRecords} 
                                    className="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-3 py-2 rounded transition-all shadow"
                                >
                                    {isSyncing ? 'Refreshing...' : '🔄 Refresh Data'}
                                </button>
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-xs text-left text-slate-300 border-collapse">
                                <thead className="text-[11px] uppercase bg-slate-900 text-cyan-400 font-bold">
                                    <tr>
                                        <th className="px-3 py-2.5 text-center">
                                            <input 
                                                type="checkbox" 
                                                onChange={handleSelectAll} 
                                                checked={selectedRows.length > 0 && selectedRows.length === allAdminRecords.filter(r => !r.isValidated).length}
                                                className="rounded cursor-pointer"
                                            />
                                        </th>
                                        <th className="px-3 py-2.5">GS.No</th>
                                        <th className="px-3 py-2.5">REF NO</th>
                                        <th className="px-3 py-2.5">EMP ID</th>
                                        <th className="px-3 py-2.5">Name</th>
                                        <th className="px-3 py-2.5">Event Date</th>
                                        <th className="px-3 py-2.5">Beneficiary Name</th>
                                        <th className="px-3 py-2.5">Amt</th>
                                        <th className="px-3 py-2.5">IO NO</th>
                                        <th className="px-3 py-2.5">Duplicate Check Rule</th>
                                        <th className="px-3 py-2.5">Status</th>
                                        <th className="px-3 py-2.5 text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700">
                                    {allAdminRecords.length === 0 ? (
                                        <tr>
                                            <td colSpan="12" className="text-center py-6 text-slate-400 italic">No submissions found in Google Sheet.</td>
                                        </tr>
                                    ) : (
                                        allAdminRecords.map((rec) => (
                                            <tr key={rec.rowIndex} className={`hover:bg-slate-750 transition-colors ${rec.isValidated ? 'bg-slate-900/60 opacity-80' : ''}`}>
                                                <td className="px-3 py-2 text-center">
                                                    <input 
                                                        type="checkbox" 
                                                        disabled={rec.isValidated}
                                                        checked={selectedRows.includes(rec.rowIndex)}
                                                        onChange={() => handleSelectRow(rec.rowIndex)}
                                                        className="rounded cursor-pointer disabled:cursor-not-allowed"
                                                    />
                                                </td>
                                                <td className="px-3 py-2 font-mono text-slate-400 font-bold">{rec.gsNo}</td>
                                                <td className="px-3 py-2 font-mono text-cyan-400 font-bold">{rec.refNumber || '-'}</td>
                                                <td className="px-3 py-2 font-mono text-cyan-300 font-bold">{rec.empId}</td>
                                                <td className="px-3 py-2 font-medium text-white">{rec.fullName}</td>
                                                <td className="px-3 py-2 font-mono">{rec.eventDate}</td>
                                                <td className="px-3 py-2">{rec.beneficiaryName || '-'}</td>
                                                <td className="px-3 py-2 font-bold text-amber-300">₹{rec.contributionAmt}</td>
                                                <td className="px-3 py-2">
                                                    <input 
                                                        type="text" 
                                                        disabled={rec.isValidated}
                                                        value={rec.ioNo || ''} 
                                                        onChange={(e) => handleAdminIoChange(rec.rowIndex, e.target.value)}
                                                        placeholder="IO NO"
                                                        className="w-28 bg-slate-900 border border-slate-600 focus:border-cyan-400 rounded px-2 py-1 font-mono text-cyan-300 text-xs focus:outline-none disabled:opacity-50 disabled:bg-slate-800"
                                                    />
                                                </td>
                                                <td className="px-3 py-2">
                                                    {rec.dupStatus === 'BLOCK_REJECT' ? (
                                                        <span className="bg-rose-900/80 text-rose-200 border border-rose-500/60 px-2 py-0.5 rounded text-[10px] font-bold inline-block" title={rec.dupMessage}>
                                                            ❌ REJECT (Exact Duplicate)
                                                        </span>
                                                    ) : rec.dupStatus === 'WARN_ALLOW' ? (
                                                        <span className="bg-amber-900/80 text-amber-200 border border-amber-500/60 px-2 py-0.5 rounded text-[10px] font-bold inline-block" title={rec.dupMessage}>
                                                            ⚠️ ALLOW (Same Date)
                                                        </span>
                                                    ) : (
                                                        <span className="bg-emerald-900/80 text-emerald-200 border border-emerald-500/60 px-2 py-0.5 rounded text-[10px] font-bold inline-block">
                                                            ✅ CLEAR
                                                        </span>
                                                    )}
                                                </td>
                                                <td className="px-3 py-2 font-semibold">
                                                    {rec.isValidated ? (
                                                        <span className="text-emerald-400 flex items-center space-x-1 font-bold">
                                                            <span>🔒</span>
                                                            <span>Validated</span>
                                                        </span>
                                                    ) : (
                                                        <span className="text-amber-400 font-bold">Pending</span>
                                                    )}
                                                </td>
                                                <td className="px-3 py-2 text-center space-x-1 whitespace-nowrap">
                                                    <button 
                                                        onClick={() => handleAdminUpdate(rec)} 
                                                        disabled={rec.isValidated || rec.dupStatus === 'BLOCK_REJECT'}
                                                        className="bg-emerald-700 hover:bg-emerald-600 disabled:bg-slate-700 disabled:text-slate-500 text-white px-2.5 py-1 rounded text-[10px] font-bold shadow transition-all disabled:cursor-not-allowed"
                                                    >
                                                        {rec.isValidated ? 'Locked' : 'Validate'}
                                                    </button>
                                                    <button 
                                                        onClick={() => handleAdminDelete(rec.rowIndex)} 
                                                        className="bg-rose-700 hover:bg-rose-600 text-white px-2.5 py-1 rounded text-[10px] font-bold shadow transition-all"
                                                    >
                                                        Delete
                                                    </button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
