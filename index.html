<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Promotion Claim Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            body > div:not(#print-root) {
                display: none !important;
            }
            #print-root {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>
    <div id="print-root" class="hidden"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycbxrwTQ-mJ9GPtu2NJRyu0W-XCFyOLVMWWCvdG92aRjkT_95XAnIelNVH6MZ3I1r_hz1Yg/exec";

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [credentials, setCredentials] = useState({ userId: '', password: '' });
            const [userRole, setUserRole] = useState('Normal');
            const [loggedInUserId, setLoggedInUserId] = useState('');
            const [loggedInUserName, setLoggedInUserName] = useState('');
            const [isAuthenticating, setIsAuthenticating] = useState(false);
            const [authError, setAuthError] = useState('');

            const [locations, setLocations] = useState([]);
            const [eventTypes, setEventTypes] = useState([]);
            const [beneficiaryCategories, setBeneficiaryCategories] = useState([]);
            const [glCodes, setGlCodes] = useState([]);
            const [costCenters, setCostCenters] = useState([]);
            const [isLoadingOptions, setIsLoadingOptions] = useState(false);

            const [formData, setFormData] = useState({
                empId: '', fullName: '', department: '', email: '', location: '',
                eventType: '', beneficiaryCategory: '', contributionAmt: '', eventDate: '',
                beneficiaryName: '', ioNo: '', glCode: '', costCenter: '', notes: '', hasExceptionApproval: false
            });

            const [records, setRecords] = useState([]);
            const [allAdminRecords, setAllAdminRecords] = useState([]);
            const [selectedRows, setSelectedRows] = useState([]);
            const [isSyncing, setIsSyncing] = useState(false);
            const [isFetchingEmp, setIsFetchingEmp] = useState(false);
            const [toast, setToast] = useState('');
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [sameDateWarningModal, setSameDateWarningModal] = useState(false);
            const [delayWarningModal, setDelayWarningModal] = useState(false);
            const [pendingDelayDays, setPendingDelayDays] = useState(0);
            const [pdfData, setPdfData] = useState(null);

            useEffect(() => {
                const sessionUser = sessionStorage.getItem('portal_user_id');
                const sessionRole = sessionStorage.getItem('portal_user_role') || 'Normal';
                const sessionName = sessionStorage.getItem('portal_user_name') || '';

                if (sessionUser) {
                    setIsAuthenticated(true);
                    setLoggedInUserId(sessionUser);
                    setUserRole(sessionRole);
                    setLoggedInUserName(sessionName);

                    if (sessionRole === 'Admin') {
                        fetchAdminRecords();
                    } else {
                        setFormData(prev => ({ ...prev, empId: sessionUser }));
                    }
                }
            }, []);

            useEffect(() => {
                if (isAuthenticated && loggedInUserId) {
                    const storageKey = `user_private_records_${loggedInUserId}`;
                    const saved = localStorage.getItem(storageKey);
                    if (saved) {
                        try { 
                            let parsed = JSON.parse(saved);
                            if (userRole !== 'Admin' && parsed.length > 12) parsed = parsed.slice(0, 12);
                            setRecords(parsed);
                        } catch (e) {
                            setRecords([]);
                        }
                    } else {
                        setRecords([]);
                    }
                }
            }, [isAuthenticated, loggedInUserId, userRole]);

            useEffect(() => {
                if (isAuthenticated && loggedInUserId) {
                    const storageKey = `user_private_records_${loggedInUserId}`;
                    localStorage.setItem(storageKey, JSON.stringify(records));
                }
            }, [records, isAuthenticated, loggedInUserId]);

            useEffect(() => {
                fetchDropdownOptions();
            }, []);

            useEffect(() => {
                if (isAuthenticated && userRole !== 'Admin' && loggedInUserId) {
                    handleFetchDataForId(loggedInUserId);
                }
            }, [isAuthenticated, userRole, loggedInUserId]);

            const getFirstName = (nameStr) => {
                if (!nameStr) return '';
                return nameStr.trim().split(' ')[0].toUpperCase();
            };

            const fetchDropdownOptions = async () => {
                setIsLoadingOptions(true);
                try {
                    const data = await jsonpRequest({ action: 'getDropdownOptions' });
                    if (data.status === 'success') {
                        setLocations(data.locations || []);
                        setEventTypes(data.eventTypes || []);
                        setBeneficiaryCategories(data.beneficiaryCategories || []);
                        setGlCodes(data.glCodes || []);
                        setCostCenters(data.costCenters || []);

                        setFormData(prev => ({
                            ...prev,
                            glCode: prev.glCode || (data.glCodes && data.glCodes[0] ? data.glCodes[0] : ''),
                            costCenter: prev.costCenter || (data.costCenters && data.costCenters[0] ? data.costCenters[0] : '')
                        }));
                    }
                } catch (err) {
                    console.error('Error fetching dropdown options:', err);
                } finally {
                    setIsLoadingOptions(false);
                }
            };

            const fetchAdminRecords = async () => {
                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ action: 'getAllRecords' });
                    if (res.status === 'success') {
                        setAllAdminRecords(res.data || []);
                        setSelectedRows([]);
                    }
                } catch (e) {
                    showToast('❌ Error loading sheet records.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 4500);
            };

            const isValidDDMMYY = (dateStr) => {
                return /^(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.\d{2}$/.test(dateStr);
            };

            const cleanDDMMYY = (rawDateStr) => {
                return rawDateStr ? rawDateStr.replace(/\./g, '') : '';
            };

            const parseDDMMYYToDate = (dateStr) => {
                if (!isValidDDMMYY(dateStr)) return null;
                const parts = dateStr.split('.');
                return new Date(2000 + parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
            };

            const calculateDayGap = (eventDateStr) => {
                const parsedEventDate = parseDDMMYYToDate(eventDateStr);
                if (!parsedEventDate) return 0;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                parsedEventDate.setHours(0, 0, 0, 0);
                return Math.floor((today.getTime() - parsedEventDate.getTime()) / (1000 * 60 * 60 * 24));
            };

            const handleEventDateChange = (e) => {
                let val = e.target.value.replace(/[^0-9.]/g, '');
                if (/^\d{6}$/.test(val)) {
                    val = `${val.slice(0, 2)}.${val.slice(2, 4)}.${val.slice(4, 6)}`;
                }
                setFormData(prev => ({ ...prev, eventDate: val }));
            };

            const formatCleanRefNo = (rawRefStr, eventDateVal) => {
                if (!rawRefStr) return '';
                const cleanDate = cleanDDMMYY(eventDateVal);
                if (rawRefStr.includes('-')) {
                    const parts = rawRefStr.split('-');
                    const seq = parts[parts.length - 1];
                    return cleanDate ? `${cleanDate}-${seq}` : parts.slice(-2).join('-');
                }
                return rawRefStr;
            };

            const generateRefNumber = (empIdVal, eventDateVal, localRecords, adminRecords) => {
                const formattedDate = cleanDDMMYY(eventDateVal);
                const sourceList = userRole === 'Admin' && adminRecords.length > 0 ? adminRecords : localRecords;
                const matchingEntries = sourceList.filter(rec => 
                    String(rec.empId || '').trim() === String(empIdVal || '').trim() && cleanDDMMYY(rec.eventDate) === formattedDate
                );
                const sequenceNum = matchingEntries.length + 1;
                return `${formattedDate}-${sequenceNum < 10 ? '0' + sequenceNum : sequenceNum}`;
            };

            const jsonpRequest = (params, retries = 3) => {
                return new Promise((resolve, reject) => {
                    const attempt = (remaining) => {
                        const callbackName = 'jsonp_cb_' + Math.round(1000000 * Math.random());
                        const timeoutId = setTimeout(() => {
                            cleanup();
                            remaining > 0 ? attempt(remaining - 1) : reject(new Error('Timed out'));
                        }, 25000);

                        const cleanup = () => {
                            clearTimeout(timeoutId);
                            delete window[callbackName];
                            if (script && script.parentNode) script.parentNode.removeChild(script);
                        };

                        window[callbackName] = (data) => { cleanup(); resolve(data); };

                        const script = document.createElement('script');
                        script.src = `${API_URL}?${new URLSearchParams({ ...params, callback: callbackName }).toString()}`;
                        script.onerror = () => { cleanup(); remaining > 0 ? attempt(remaining - 1) : reject(new Error('Script error')); };
                        document.body.appendChild(script);
                    };
                    attempt(retries);
                });
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsAuthenticating(true);
                setAuthError('');
                try {
                    const cleanUserId = credentials.userId.trim();
                    const data = await jsonpRequest({ action: 'login', userId: cleanUserId, password: credentials.password.trim() });
                    if (data.status === 'success') {
                        setIsAuthenticated(true);
                        setUserRole(data.role || 'Normal');
                        setLoggedInUserId(cleanUserId);
                        setLoggedInUserName(data.userName || '');

                        sessionStorage.setItem('portal_user_id', cleanUserId);
                        sessionStorage.setItem('portal_user_role', data.role || 'Normal');
                        sessionStorage.setItem('portal_user_name', data.userName || '');

                        if (data.role === 'Admin') fetchAdminRecords();
                    } else {
                        setAuthError('❌ Invalid User ID or Password.');
                    }
                } catch (err) {
                    setAuthError('❌ Network error during sign in.');
                } finally {
                    setIsAuthenticating(false);
                }
            };

            const handleLogout = () => {
                sessionStorage.clear();
                setIsAuthenticated(false);
                setUserRole('Normal');
                setLoggedInUserId('');
                setLoggedInUserName('');
                setCredentials({ userId: '', password: '' });
                setRecords([]);
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleEmpIdChange = (e) => {
                if (userRole !== 'Admin') return;
                setFormData(prev => ({ ...prev, empId: e.target.value.replace(/\D/g, ''), fullName: '', department: '', email: '' }));
            };

            const handleAdminIoChange = (rowIndex, val) => {
                setAllAdminRecords(prev => prev.map(item => item.rowIndex === rowIndex ? { ...item, ioNo: val } : item));
            };

            const handleSelectRow = (rowIndex) => {
                setSelectedRows(prev => prev.includes(rowIndex) ? prev.filter(id => id !== rowIndex) : [...prev, rowIndex]);
            };

            const handleSelectAll = () => {
                setSelectedRows(selectedRows.length === allAdminRecords.length ? [] : allAdminRecords.map(r => r.rowIndex));
            };

            const handleFetchDataForId = async (empIdToFetch) => {
                if (!empIdToFetch) return;
                setIsFetchingEmp(true);
                try {
                    const data = await jsonpRequest({ action: 'getEmpName', empId: empIdToFetch.trim() });
                    if (data.status === 'success') {
                        setFormData(prev => ({ ...prev, fullName: data.empFullName || '', department: data.department || '', email: data.email || '' }));
                        showToast('✅ Employee data captured!');
                    } else {
                        showToast('⚠️ Employee record not found.');
                    }
                } catch (err) {
                    showToast('❌ Error fetching employee data.');
                } finally {
                    setIsFetchingEmp(false);
                }
            };

            const handleAdminUpdate = async (rec) => {
                if (rec.isValidated) return showToast('⚠️ Row already validated!');
                if (!rec.ioNo || !rec.ioNo.trim()) return showToast('❌ IO NO is compulsory for validation!');

                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ action: 'updateRecord', rowIndex: rec.rowIndex, ioNo: rec.ioNo.trim() });
                    if (res.status === 'success') {
                        showToast('✅ Record Validated & Added to Uploader!');
                        fetchAdminRecords();
                    } else {
                        showToast(`⚠️ ${res.message}`);
                    }
                } catch (e) {
                    showToast('❌ Failed to update record');
                } finally {
                    setIsSyncing(false);
                }
            };

            // AUTOMATED LOCAL POSTING TRIGGER
            const handlePostSapGui = async (rec) => {
                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ action: 'postSapGui', rowIndex: rec.rowIndex });
                    if (res.status === 'success') {
                        showToast('🚀 Status set to "Ready for SAP". Triggering local SAP Bot...');
                        fetchAdminRecords();

                        try {
                            const localRes = await fetch('http://127.0.0.1:5000/run-sap', { method: 'POST' });
                            const localData = await localRes.json();
                            if (localData.status === 'success') {
                                showToast('🤖 Local SAP Bot execution started!');
                            }
                        } catch (err) {
                            showToast('⚠️ Updated in Sheet, but Local SAP Bridge is not running on PC.');
                        }
                    } else {
                        showToast(`⚠️ ${res.message}`);
                    }
                } catch (e) {
                    showToast('❌ Failed to update SAP GUI status');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleBulkPostSapGui = async () => {
                if (selectedRows.length === 0) return showToast('⚠️ Select at least one row.');
                const validatedSelected = allAdminRecords.filter(r => selectedRows.includes(r.rowIndex) && r.isValidated);
                if (validatedSelected.length === 0) return showToast('⚠️ Selected rows are not validated.');

                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({
                        action: 'bulkPostSapGui',
                        rowIndices: JSON.stringify(validatedSelected.map(r => r.rowIndex))
                    });

                    if (res.status === 'success') {
                        showToast(`🚀 ${res.message} Triggering local SAP Bot...`);
                        fetchAdminRecords();

                        try {
                            const localRes = await fetch('http://127.0.0.1:5000/run-sap', { method: 'POST' });
                            const localData = await localRes.json();
                            if (localData.status === 'success') {
                                showToast('🤖 Local SAP Bot started!');
                            }
                        } catch (err) {
                            showToast('⚠️ Updated in Sheet, but Local SAP Bridge is not running on PC.');
                        }
                    } else {
                        showToast('❌ Bulk SAP GUI Posting failed.');
                    }
                } catch (e) {
                    showToast('❌ Error executing bulk SAP GUI Posting.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleBulkValidate = async () => {
                if (selectedRows.length === 0) return showToast('⚠️ Select at least one row to validate.');
                const recordsToValidate = allAdminRecords.filter(r => selectedRows.includes(r.rowIndex) && !r.isValidated);
                if (recordsToValidate.some(r => !r.ioNo || !r.ioNo.trim())) return showToast('❌ All selected rows must have an IO NO!');

                setIsSyncing(true);
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'bulkValidateRecords', records: recordsToValidate })
                    }).then(r => r.json());

                    if (res.status === 'success') {
                        showToast(`✅ ${res.message}`);
                        fetchAdminRecords();
                    }
                } catch (e) {
                    showToast('❌ Error performing bulk validation.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleBulkDelete = async () => {
                if (selectedRows.length === 0) return showToast('⚠️ Select at least one row to delete.');
                if (!confirm(`Delete ${selectedRows.length} row(s) from Google Sheet?`)) return;

                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ action: 'bulkDeleteRecords', rowIndices: JSON.stringify(selectedRows) });
                    if (res.status === 'success') {
                        showToast(`🗑️ ${res.message}`);
                        fetchAdminRecords();
                    }
                } catch (e) {
                    showToast('❌ Error performing bulk deletion.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleAdminDelete = async (rowIndex) => {
                if (!confirm('Delete this row from Google Sheet?')) return;
                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ action: 'deleteRecord', rowIndex });
                    if (res.status === 'success') {
                        showToast('🗑️ Record Deleted!');
                        fetchAdminRecords();
                    }
                } catch (e) {
                    showToast('❌ Failed to delete record');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.fullName || !formData.email || !formData.empId || !formData.eventDate) return showToast('⚠️ Fill all required fields!');
                if (!isValidDDMMYY(formData.eventDate)) return showToast('❌ Invalid Date! Format must be DD.MM.YY');

                const checkSource = userRole === 'Admin' && allAdminRecords.length > 0 ? allAdminRecords : records;
                const isStrictDuplicate = checkSource.some(rec => 
                    String(rec.empId || '').trim() === String(formData.empId || '').trim() &&
                    cleanDDMMYY(rec.eventDate) === cleanDDMMYY(formData.eventDate) &&
                    rec.beneficiaryName.trim().toLowerCase() === formData.beneficiaryName.trim().toLowerCase() &&
                    rec.beneficiaryName.trim() !== ""
                );

                if (isStrictDuplicate) return showToast('❌ Submission Blocked: Exact duplicate claim exists!');

                const daysGap = calculateDayGap(formData.eventDate);
                if (daysGap > 15 && !formData.hasExceptionApproval) {
                    setPendingDelayDays(daysGap);
                    setDelayWarningModal(true);
                    return;
                }

                executeSubmission(formData.hasExceptionApproval);
            };

            const executeSubmission = async (exceptionState = formData.hasExceptionApproval) => {
                setIsSyncing(true);
                setSameDateWarningModal(false);
                const timestamp = new Date().toLocaleString();
                const refNumber = generateRefNumber(formData.empId, formData.eventDate, records, allAdminRecords);

                try {
                    await jsonpRequest({
                        action: 'submit', timestamp, empId: formData.empId, fullName: formData.fullName,
                        department: formData.department, email: formData.email, location: formData.location,
                        eventType: formData.eventType, eventDate: formData.eventDate, beneficiaryCategory: formData.beneficiaryCategory,
                        beneficiaryName: formData.beneficiaryName, contributionAmt: formData.contributionAmt, refNumber,
                        notes: formData.notes, glCode: formData.glCode, costCenter: formData.costCenter, ioNo: formData.ioNo,
                        hasExceptionApproval: exceptionState ? 'Yes' : 'No'
                    });

                    showToast(`✅ Synced! Ref: ${refNumber}`);
                    if (userRole === 'Admin') fetchAdminRecords();
                } catch (err) {
                    showToast('❌ Error submitting data.');
                } finally {
                    setIsSyncing(false);
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl">
                            <h2 className="text-xl font-bold text-cyan-400 text-center mb-4">Sales Promotion Claim Portal</h2>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="text" placeholder="User ID" value={credentials.userId} onChange={e => setCredentials(p => ({ ...p, userId: e.target.value }))} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100" required />
                                <input type="password" placeholder="Password" value={credentials.password} onChange={e => setCredentials(p => ({ ...p, password: e.target.value }))} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100" required />
                                <button type="submit" disabled={isAuthenticating} className="w-full bg-cyan-600 hover:bg-cyan-500 font-bold py-2 rounded text-sm text-white">{isAuthenticating ? 'Authenticating...' : 'Sign In'}</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-[95%] mx-auto p-6">
                    <div className="flex justify-between items-center mb-6">
                        <h1 className="text-xl font-bold text-cyan-400">Sales Promotion Claim Portal</h1>
                        <button onClick={handleLogout} className="bg-slate-700 text-xs px-3 py-2 rounded text-slate-200">Logout</button>
                    </div>

                    {toast && <div className="fixed top-5 right-5 bg-slate-800 border border-cyan-500 text-slate-100 px-4 py-3 rounded shadow-2xl z-50 text-sm">{toast}</div>}

                    {userRole === 'Admin' && (
                        <div className="bg-slate-800 p-6 rounded-xl border border-amber-500/40 shadow-xl mb-8">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-amber-300">👑 Admin Validation Dashboard</h2>
                                <div className="flex space-x-2">
                                    <button onClick={handleBulkValidate} disabled={selectedRows.length === 0} className="bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded disabled:opacity-50">Validate ({selectedRows.length})</button>
                                    <button onClick={handleBulkPostSapGui} disabled={selectedRows.length === 0} className="bg-blue-600 text-white text-xs font-bold px-3 py-2 rounded disabled:opacity-50">Post SAP GUI ({selectedRows.length})</button>
                                    <button onClick={handleBulkDelete} disabled={selectedRows.length === 0} className="bg-rose-700 text-white text-xs font-bold px-3 py-2 rounded disabled:opacity-50">Delete ({selectedRows.length})</button>
                                    <button onClick={fetchAdminRecords} className="bg-cyan-600 text-white text-xs font-bold px-3 py-2 rounded">Refresh</button>
                                </div>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-xs text-left text-slate-300 border-collapse">
                                    <thead className="bg-slate-900 text-cyan-400 font-bold">
                                        <tr>
                                            <th className="px-3 py-2 text-center"><input type="checkbox" onChange={handleSelectAll} checked={selectedRows.length > 0 && selectedRows.length === allAdminRecords.length} /></th>
                                            <th className="px-3 py-2">GS.No</th>
                                            <th className="px-3 py-2">REF NO</th>
                                            <th className="px-3 py-2">EMP ID</th>
                                            <th className="px-3 py-2">Name</th>
                                            <th className="px-3 py-2">Event Date</th>
                                            <th className="px-3 py-2">Amt</th>
                                            <th className="px-3 py-2">IO NO *</th>
                                            <th className="px-3 py-2">Validation</th>
                                            <th className="px-3 py-2 text-center">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700">
                                        {allAdminRecords.map(rec => (
                                            <tr key={rec.rowIndex} className="hover:bg-slate-750">
                                                <td className="px-3 py-2 text-center"><input type="checkbox" checked={selectedRows.includes(rec.rowIndex)} onChange={() => handleSelectRow(rec.rowIndex)} /></td>
                                                <td className="px-3 py-2 font-mono">{rec.gsNo}</td>
                                                <td className="px-3 py-2 font-mono text-cyan-400 font-bold">{formatCleanRefNo(rec.refNumber, rec.eventDate)}</td>
                                                <td className="px-3 py-2 font-mono text-cyan-300">{rec.empId}</td>
                                                <td className="px-3 py-2">{rec.fullName}</td>
                                                <td className="px-3 py-2 font-mono">{rec.eventDate}</td>
                                                <td className="px-3 py-2 font-bold text-amber-300">₹{rec.contributionAmt}</td>
                                                <td className="px-3 py-2">
                                                    <input type="text" disabled={rec.isValidated} value={rec.ioNo || ''} onChange={e => handleAdminIoChange(rec.rowIndex, e.target.value)} placeholder="IO NO Required" className="w-32 bg-slate-900 border border-slate-700 px-2 py-1 rounded text-xs" />
                                                </td>
                                                <td className="px-3 py-2 font-semibold">
                                                    {rec.isValidated ? <span className="text-emerald-400 font-bold">{rec.sapStatus}</span> : <span className="text-amber-400 font-bold">Pending</span>}
                                                </td>
                                                <td className="px-3 py-2 text-center space-x-1">
                                                    <button onClick={() => handleAdminUpdate(rec)} disabled={rec.isValidated} className="bg-emerald-700 text-white px-2.5 py-1 rounded text-[10px] disabled:opacity-50">Validate</button>
                                                    <button onClick={() => handlePostSapGui(rec)} disabled={!rec.isValidated || rec.sapStatus === 'Ready for SAP'} className="bg-blue-600 text-white px-2.5 py-1 rounded text-[10px] disabled:opacity-50">Post (SAP GUI)</button>
                                                    <button onClick={() => handleAdminDelete(rec.rowIndex)} className="bg-rose-700 text-white px-2.5 py-1 rounded text-[10px]">Delete</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
