<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Promotion Claim Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_URL = "https://script.google.com/macros/s/AKfycbwegeAMEVGmm3S85ObAuhq7n2x_20oFENZ4FPIxkfbFkxVWUnDMbuAW8-lfcQl62sKGvg/exec";

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [credentials, setCredentials] = useState({ userId: '', password: '' });
            const [userRole, setUserRole] = useState('Normal');
            const [loggedInUserId, setLoggedInUserId] = useState('');
            const [loggedInUserName, setLoggedInUserName] = useState('');
            const [isAuthenticating, setIsAuthenticating] = useState(false);
            const [authError, setAuthError] = useState('');

            // Dropdown Options
            const [locations, setLocations] = useState([]);
            const [eventTypes, setEventTypes] = useState([]);
            const [beneficiaryCategories, setBeneficiaryCategories] = useState([]);

            // Form Data
            const [formData, setFormData] = useState({
                empId: '', fullName: '', department: '', email: '', location: '',
                eventType: '', beneficiaryCategory: '', contributionAmt: '',
                eventDate: '', beneficiaryName: '', ioNo: '', glCode: '230189', notes: ''
            });

            const [records, setRecords] = useState([]);
            const [allAdminRecords, setAllAdminRecords] = useState([]);
            const [isSyncing, setIsSyncing] = useState(false);
            const [isFetchingEmp, setIsFetchingEmp] = useState(false);
            const [toast, setToast] = useState('');
            const [pdfData, setPdfData] = useState(null);

            useEffect(() => {
                const sessionUser = sessionStorage.getItem('portal_user_id');
                const sessionRole = sessionStorage.getItem('portal_user_role') || 'Normal';
                const sessionName = sessionStorage.getItem('portal_user_name') || '';

                if (sessionUser) {
                    setIsAuthenticated(true);
                    setLoggedInUserId(sessionUser);
                    setUserRole(sessionRole);
                    setLoggedInUserName(sessionName);
                    if (sessionRole === 'Admin') fetchAdminRecords();
                    else setFormData(prev => ({ ...prev, empId: sessionUser }));
                }
            }, []);

            useEffect(() => {
                fetchDropdownOptions();
            }, []);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 4500);
            };

            const jsonpRequest = (params) => {
                return new Promise((resolve, reject) => {
                    const callbackName = 'jsonp_cb_' + Math.round(1000000 * Math.random());
                    window[callbackName] = (data) => {
                        delete window[callbackName];
                        if (script && script.parentNode) script.parentNode.removeChild(script);
                        resolve(data);
                    };
                    const queryParams = new URLSearchParams({ ...params, callback: callbackName }).toString();
                    const script = document.createElement('script');
                    script.src = `${API_URL}?${queryParams}`;
                    script.onerror = () => reject(new Error('Script execution error.'));
                    document.body.appendChild(script);
                });
            };

            const fetchDropdownOptions = async () => {
                try {
                    const data = await jsonpRequest({ action: 'getDropdownOptions' });
                    if (data.status === 'success') {
                        setLocations(data.locations || []);
                        setEventTypes(data.eventTypes || []);
                        setBeneficiaryCategories(data.beneficiaryCategories || []);
                    }
                } catch (e) {}
            };

            const fetchAdminRecords = async () => {
                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ action: 'getAllRecords' });
                    if (res.status === 'success') {
                        setAllAdminRecords(res.data || []);
                    }
                } catch (e) {
                    showToast('❌ Error loading records from Sheet.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsAuthenticating(true);
                setAuthError('');

                try {
                    const cleanUserId = credentials.userId.trim();
                    const data = await jsonpRequest({
                        action: 'login',
                        userId: cleanUserId,
                        password: credentials.password.trim()
                    });

                    if (data.status === 'success') {
                        const role = data.role || 'Normal';
                        setIsAuthenticated(true);
                        setUserRole(role);
                        setLoggedInUserId(cleanUserId);
                        setLoggedInUserName(data.userName || '');

                        sessionStorage.setItem('portal_user_id', cleanUserId);
                        sessionStorage.setItem('portal_user_role', role);

                        if (role === 'Admin') {
                            fetchAdminRecords();
                        } else {
                            setFormData(prev => ({ ...prev, empId: cleanUserId }));
                        }
                    } else {
                        setAuthError('❌ Invalid Credentials.');
                    }
                } catch (err) {
                    setAuthError('❌ Connection Error.');
                } finally {
                    setIsAuthenticating(false);
                }
            };

            const handleLogout = () => {
                sessionStorage.clear();
                setIsAuthenticated(false);
                setUserRole('Normal');
            };

            const handleAdminUpdate = async (rec) => {
                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ action: 'updateRecord', ...rec });
                    if (res.status === 'success') {
                        showToast('✅ Record Updated Successfully!');
                        fetchAdminRecords();
                    }
                } catch (e) {
                    showToast('❌ Update Failed');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleAdminDelete = async (rowIndex) => {
                if (!confirm('Are you sure you want to delete this claim row from Google Sheet?')) return;
                setIsSyncing(true);
                try {
                    const res = await jsonpRequest({ action: 'deleteRecord', rowIndex });
                    if (res.status === 'success') {
                        showToast('🗑️ Record Deleted from Sheet!');
                        fetchAdminRecords();
                    }
                } catch (e) {
                    showToast('❌ Delete Failed');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSyncing(true);
                const timestamp = new Date().toLocaleString();

                try {
                    await jsonpRequest({
                        action: 'submit',
                        empId: formData.empId,
                        fullName: formData.fullName,
                        department: formData.department,
                        email: formData.email,
                        location: formData.location,
                        eventType: formData.eventType,
                        eventDate: formData.eventDate,
                        beneficiaryCategory: formData.beneficiaryCategory,
                        beneficiaryName: formData.beneficiaryName,
                        contributionAmt: formData.contributionAmt,
                        notes: formData.notes,
                        glCode: formData.glCode,
                        ioNo: formData.ioNo
                    });

                    showToast('✅ Claim Submitted Successfully!');
                    if (userRole === 'Admin') fetchAdminRecords();
                } catch (err) {
                    showToast('❌ Submission Error.');
                } finally {
                    setIsSyncing(false);
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl">
                            <h2 className="text-xl font-bold text-cyan-400 mb-4 text-center">Portal Sign In</h2>
                            {authError && <div className="mb-4 text-rose-300 text-xs text-center">{authError}</div>}
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="text" placeholder="User ID" required className="w-full bg-slate-900 border p-2 rounded text-sm text-white" value={credentials.userId} onChange={e => setCredentials(p => ({ ...p, userId: e.target.value }))} />
                                <input type="password" placeholder="Password" required className="w-full bg-slate-900 border p-2 rounded text-sm text-white" value={credentials.password} onChange={e => setCredentials(p => ({ ...p, password: e.target.value }))} />
                                <button type="submit" className="w-full bg-cyan-600 font-bold py-2 rounded text-sm">{isAuthenticating ? 'Signing In...' : 'Sign In'}</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto p-6">
                    <div className="flex justify-between items-center mb-6 flex-wrap gap-4">
                        <h1 className="text-xl font-bold text-cyan-400 uppercase">Sales Promotion Claim Portal ({userRole})</h1>
                        <button onClick={handleLogout} className="bg-slate-700 text-xs px-3 py-2 rounded">Logout</button>
                    </div>

                    {toast && <div className="fixed top-5 right-5 bg-slate-800 border border-cyan-500 px-4 py-2 rounded text-sm z-50">{toast}</div>}

                    {/* ADMIN VIEW ALL SHEET DATA */}
                    {userRole === 'Admin' && (
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl mb-8">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-amber-300">Admin Validation Dashboard (Google Sheet "Data")</h2>
                                <button onClick={fetchAdminRecords} className="bg-cyan-600 text-xs font-bold px-3 py-1.5 rounded">{isSyncing ? 'Refreshing...' : '🔄 Refresh Sheet Data'}</button>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-xs text-left text-slate-300">
                                    <thead className="bg-slate-900 uppercase font-bold text-cyan-400">
                                        <tr>
                                            <th className="p-2">Row</th>
                                            <th className="p-2">EMP ID</th>
                                            <th className="p-2">Name</th>
                                            <th className="p-2">Event Date</th>
                                            <th className="p-2">Amt</th>
                                            <th className="p-2">GL Code</th>
                                            <th className="p-2">IO No</th>
                                            <th className="p-2">SAP Status</th>
                                            <th className="p-2 text-center">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700">
                                        {allAdminRecords.map((rec) => (
                                            <tr key={rec.rowIndex} className="hover:bg-slate-750">
                                                <td className="p-2 font-mono">{rec.rowIndex}</td>
                                                <td className="p-2 font-mono text-cyan-300">{rec.empId}</td>
                                                <td className="p-2">{rec.fullName}</td>
                                                <td className="p-2">{rec.eventDate}</td>
                                                <td className="p-2 font-bold">{rec.contributionAmt}</td>
                                                <td className="p-2 font-mono">{rec.glCode}</td>
                                                <td className="p-2 font-mono">{rec.ioNo || '-'}</td>
                                                <td className="p-2 font-semibold text-emerald-400">{rec.sapStatus || 'Pending'}</td>
                                                <td className="p-2 text-center space-x-1">
                                                    <button onClick={() => handleAdminUpdate({ rowIndex: rec.rowIndex, sapStatus: 'Validated by Admin' })} className="bg-emerald-700 px-2 py-1 rounded text-[10px]">Validate</button>
                                                    <button onClick={() => handleAdminDelete(rec.rowIndex)} className="bg-rose-700 px-2 py-1 rounded text-[10px]">Delete</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* CLAIM SUBMISSION FORM */}
                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                        <h2 className="text-md font-bold text-slate-200 mb-4">New Claim Entry</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div>
                                    <label className="text-xs text-slate-300 font-bold">EMP ID</label>
                                    <input type="text" value={formData.empId} onChange={e => setFormData(p => ({ ...p, empId: e.target.value }))} required className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-300 font-bold">Full Name</label>
                                    <input type="text" value={formData.fullName} onChange={e => setFormData(p => ({ ...p, fullName: e.target.value }))} required className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-300 font-bold">Email</label>
                                    <input type="email" value={formData.email} onChange={e => setFormData(p => ({ ...p, email: e.target.value }))} required className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div>
                                    <label className="text-xs text-slate-300 font-bold">Event Date (DD.MM.YY)</label>
                                    <input type="text" value={formData.eventDate} onChange={e => setFormData(p => ({ ...p, eventDate: e.target.value }))} placeholder="12.05.26" required className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white font-mono" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-300 font-bold">Contribution Amount</label>
                                    <input type="number" value={formData.contributionAmt} onChange={e => setFormData(p => ({ ...p, contributionAmt: e.target.value }))} required className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-300 font-bold">GL Code</label>
                                    <input type="text" value={formData.glCode} onChange={e => setFormData(p => ({ ...p, glCode: e.target.value }))} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white font-mono" />
                                </div>
                            </div>

                            <button type="submit" disabled={isSyncing} className="w-full bg-cyan-600 font-bold py-2.5 rounded text-sm">{isSyncing ? 'Syncing Data...' : 'Submit Claim'}</button>
                        </form>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
